name: fork-ci

on:
  push:
    branches: [master, local-server-setup]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - run: node tools/dev/check-docs.mjs
      - run: python3 tools/dev/command-index.py --check

  tools:
    name: tool-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: make test-tools

  sql:
    name: sql-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python3 apps/codestyle/codestyle-sql.py

  cpp-lint:
    name: cpp-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: python3 apps/codestyle/codestyle-cpp.py
      - run: |
          cppcheck --force --inline-suppr --suppressions-list=.suppress.cppcheck \
            src/ --output-file=cppcheck.txt
          if [ -s cppcheck.txt ]; then cat cppcheck.txt; exit 1; fi

  build:
    name: build-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libboost-all-dev libssl-dev libreadline-dev \
            default-libmysqlclient-dev mysql-client libbz2-dev zlib1g-dev
      - name: Configure
        # Use the distribution CMake 3.28: the runner's preinstalled 3.31 has no FindBoost
        # module (CMP0167). Point Boost at the system package configuration explicitly, because
        # the runner image can carry other Boost CMake files that break the automatic search.
        run: |
          /usr/bin/cmake --version
          BOOST_DIR="$(dirname "$(find /usr/lib -path '*/cmake/Boost-*/BoostConfig.cmake' | head -1)")"
          echo "Boost_DIR=${BOOST_DIR:-not found}"
          find /usr/lib /usr/local -name 'BoostConfig.cmake' 2>/dev/null | head -5
          /usr/bin/cmake -S . -B build \
            ${BOOST_DIR:+-DBoost_DIR="$BOOST_DIR"} \
            -DBoost_ROOT=/usr \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSCRIPTS=static -DMODULES=static \
            -DBUILD_TESTING=ON
      - name: Build
        run: /usr/bin/cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ./build/src/test/unit_tests
